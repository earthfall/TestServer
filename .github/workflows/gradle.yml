# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  checks: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Verify nullness compiler checks
      id: nullness
      run: bash .github/scripts/check-nullness.sh

    - name: Build, test, and check JSpecify nullness
      id: verification
      run: ./gradlew build

    - name: Build container and verify startup and API contracts
      id: container
      run: bash .github/scripts/check-container.sh

    - name: Summarize verification results
      if: always()
      env:
        NULLNESS_RESULT: ${{ steps.nullness.outcome }}
        BUILD_RESULT: ${{ steps.verification.outcome }}
        CONTAINER_RESULT: ${{ steps.container.outcome }}
      run: python3 .github/scripts/summarize-ci.py

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
      if: success() || failure() # always run even if the previous step fails
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'
