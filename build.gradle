plugins {
    id 'java'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'com.google.protobuf' version '0.9.4'
    id 'org.graalvm.buildtools.native' version '0.11.1'
}

group 'testserver'
version '0.1.0'
description 'REST API Test'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    // https://docs.spring.io/spring-boot/appendix/dependency-versions/coordinates.html
    set('snippetsDir', file("build/generated-snippets"))
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.2'
    implementation 'org.jspecify:jspecify:1.0.0'
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')

    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    modules {
        module("org.springframework.boot:spring-boot-starter-logging") {
            replacedBy("org.springframework.boot:spring-boot-starter-log4j2", "Use Log4j2 instead of Logback")
        }
    }
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.43.0'

    implementation 'tools.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'software.amazon.awssdk:dynamodb'

    implementation 'com.google.protobuf:protobuf-java'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'org.assertj:assertj-core'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        error('NullAway', 'JSpecifyUnrecognizedAnnotationLocation', 'RequireExplicitNullMarking')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
        // Protobuf and Spring AOT sources are generated under build/.
        excludedPaths = '.*/build/.*'
    }
}

// Compile-only fixtures verify that the configured compiler checks stay active.
['Valid', 'Invalid', 'Unmarked'].each { fixture ->
    tasks.register("compile${fixture}NullnessFixture", JavaCompile) {
        group = 'verification'
        description = "Compile the ${fixture.toLowerCase()} nullness verification fixture"
        source = fileTree("src/nullnessCheck/${fixture.toLowerCase()}") { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath
        options.annotationProcessorPath = configurations.annotationProcessor
        javaCompiler = javaToolchains.compilerFor(java.toolchain)
        destinationDirectory = layout.buildDirectory.dir("nullnessCheck/${fixture.toLowerCase()}")
        options.errorprone.enabled = true
        // Always exercise the checker, including when CI restores Gradle caches.
        outputs.upToDateWhen { false }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${dependencyManagement.importedProperties['protobuf-java.version']}"
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}

tasks.named('bootBuildImage') {
    imageName = "testserver/${project.name.toLowerCase(java.util.Locale.ROOT)}:${project.version}"
    builder = 'paketobuildpacks/builder-noble-java-tiny:latest'
    environment = ['BP_JVM_VERSION': '25', 'BP_NATIVE_IMAGE': 'false']
}
